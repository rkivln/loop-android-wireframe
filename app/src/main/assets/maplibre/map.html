<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Loop MapLibre Map</title>
    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="maplibre-gl.css" onerror="this.onerror=null;this.href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css';" />
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #F6F4ED;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }
        /* Custom Marker Pins */
        .loop-marker {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(27, 28, 25, 0.22);
            border: 2.5px solid #FFFFFF;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
            user-select: none;
            background: #FFFFFF;
        }
        .loop-marker:active, .loop-marker.active {
            transform: scale(1.22);
            box-shadow: 0 8px 24px rgba(27, 28, 25, 0.35);
            border-color: #2D5A43;
            z-index: 1000 !important;
        }
        .pin-event { background: #FDE8E1; border-color: #E07A5F; }
        .pin-help { background: #E2EFE7; border-color: #2D5A43; }
        .pin-study { background: #FEF7DA; border-color: #D4A31A; }
        .pin-hub { background: #1B1C19; border-color: #63C195; color: #FFFFFF; }
        .pin-maker { background: #E5EFF7; border-color: #4A7A96; }

        /* Live User GPS Marker */
        .user-gps-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2563EB;
            border: 3px solid #FFFFFF;
            box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.22);
        }

        /* MapLibre Popups */
        .maplibregl-popup-content {
            border-radius: 16px;
            padding: 12px 14px;
            background: #FFFFFF;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
            border: 1px solid #E8E5DD;
            max-width: 240px;
        }
        .maplibregl-popup-close-button {
            padding: 4px 8px;
            font-size: 16px;
            color: #797670;
        }
        .popup-title {
            font-size: 13px;
            font-weight: 700;
            color: #1B1C19;
            margin-bottom: 2px;
            line-height: 1.3;
        }
        .popup-subtitle {
            font-size: 11px;
            font-weight: 500;
            color: #797670;
            margin-bottom: 6px;
        }
        .popup-action {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2D5A43;
            background: #E2EFE7;
            padding: 3px 8px;
            border-radius: 6px;
        }
    </style>
    <!-- MapLibre GL JS (with CDN fallback) -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>

<script>
    let map = null;
    let markers = [];
    let currentPins = [];
    let selectedPinId = null;
    let userLocation = null;
    let userMarker = null;

    // Neutral global overview until live GPS coordinates are provided
    const INITIAL_CENTER = [0.0, 20.0];
    const INITIAL_ZOOM = 1.5;

    // Clean OpenStreetMap raster style
    const osmRasterStyle = {
        version: 8,
        sources: {
            'osm-raster': {
                type: 'raster',
                tiles: [
                    'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
                ],
                tileSize: 256,
                attribution: '© OpenStreetMap contributors'
            }
        },
        layers: [
            {
                id: 'osm-raster-layer',
                type: 'raster',
                source: 'osm-raster',
                minzoom: 0,
                maxzoom: 19
            }
        ]
    };

    function initMap() {
        if (typeof maplibregl === 'undefined') {
            setTimeout(initMap, 200);
            return;
        }

        try {
            map = new maplibregl.Map({
                container: 'map',
                style: 'https://tiles.openfreemap.org/styles/liberty',
                center: INITIAL_CENTER,
                zoom: INITIAL_ZOOM,
                pitch: 0,
                bearing: 0,
                attributionControl: false
            });
        } catch (e) {
            console.warn('Fallback to OSM raster style:', e);
            map = new maplibregl.Map({
                container: 'map',
                style: osmRasterStyle,
                center: INITIAL_CENTER,
                zoom: INITIAL_ZOOM,
                attributionControl: false
            });
        }

        map.on('error', function(e) {
            if (e && e.error && e.error.message && e.error.message.includes('style')) {
                console.warn('Switching style due to error:', e.error);
                map.setStyle(osmRasterStyle);
            }
        });

        map.on('style.load', function() {
            if (userLocation) {
                drawWalkableRadius(userLocation.lng, userLocation.lat, 0.5);
            }
        });

        map.on('load', function() {
            if (userLocation) {
                applyUserLocation(userLocation.lat, userLocation.lng, true);
            }

            if (currentPins && currentPins.length > 0) {
                renderMarkers(currentPins);
            }

            if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                window.AndroidBridge.onMapReady();
            }
        });

        map.on('click', function(e) {
            if (!e.defaultPrevented) {
                selectedPinId = null;
                clearSelectedClass();
                if (window.AndroidBridge && window.AndroidBridge.onMapClick) {
                    window.AndroidBridge.onMapClick();
                }
            }
        });
    }

    function createGeoJSONCircle(center, radiusKm, points = 64) {
        const coords = { latitude: center[1], longitude: center[0] };
        const km = radiusKm;
        const ret = [];
        const distanceX = km / (111.320 * Math.cos(coords.latitude * Math.PI / 180));
        const distanceY = km / 110.574;

        for (let i = 0; i < points; i++) {
            const theta = (i / points) * (2 * Math.PI);
            const x = distanceX * Math.cos(theta);
            const y = distanceY * Math.sin(theta);
            ret.push([coords.longitude + x, coords.latitude + y]);
        }
        ret.push(ret[0]);
        return {
            type: 'Feature',
            geometry: {
                type: 'Polygon',
                coordinates: [ret]
            }
        };
    }

    function drawWalkableRadius(lng, lat, radiusKm) {
        if (!map || !map.isStyleLoaded()) return;
        const circleData = createGeoJSONCircle([lng, lat], radiusKm);

        if (map.getSource('walkable-radius')) {
            map.getSource('walkable-radius').setData(circleData);
        } else {
            map.addSource('walkable-radius', {
                type: 'geojson',
                data: circleData
            });

            map.addLayer({
                id: 'walkable-radius-fill',
                type: 'fill',
                source: 'walkable-radius',
                paint: {
                    'fill-color': '#63C195',
                    'fill-opacity': 0.16
                }
            });

            map.addLayer({
                id: 'walkable-radius-line',
                type: 'line',
                source: 'walkable-radius',
                paint: {
                    'line-color': '#2D5A43',
                    'line-width': 2,
                    'line-dasharray': [3, 2]
                }
            });
        }
    }

    function applyUserLocation(lat, lng, autoCenter) {
        userLocation = { lat: lat, lng: lng };
        if (!map) return;

        if (!userMarker) {
            const el = document.createElement('div');
            el.className = 'user-gps-dot';
            userMarker = new maplibregl.Marker({ element: el })
                .setLngLat([lng, lat])
                .addTo(map);
        } else {
            userMarker.setLngLat([lng, lat]);
        }

        drawWalkableRadius(lng, lat, 0.5);

        if (autoCenter !== false) {
            map.flyTo({
                center: [lng, lat],
                zoom: 14.8,
                pitch: 15,
                essential: true,
                speed: 1.4
            });
        }
    }

    function clearMarkers() {
        markers.forEach(m => m.remove());
        markers = [];
    }

    function clearSelectedClass() {
        document.querySelectorAll('.loop-marker').forEach(el => el.classList.remove('active'));
    }

    function getPinClass(type) {
        switch(type) {
            case 'COMMUNITY_EVENT': return 'pin-event';
            case 'HELP_REQUEST': return 'pin-help';
            case 'STUDY_GROUP': return 'pin-study';
            case 'PICKUP_HUB': return 'pin-hub';
            case 'USER_HOST':
            case 'RENTAL_ITEM': return 'pin-maker';
            default: return 'pin-event';
        }
    }

    function getPinSvg(type) {
        const stroke = type === 'PICKUP_HUB' ? '#FFFFFF' : '#1B1C19';
        switch(type) {
            case 'COMMUNITY_EVENT':
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
            case 'HELP_REQUEST':
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`;
            case 'STUDY_GROUP':
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`;
            case 'PICKUP_HUB':
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
            case 'USER_HOST':
            case 'RENTAL_ITEM':
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`;
            default:
                return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
        }
    }

    function renderMarkers(pins) {
        currentPins = pins || [];
        clearMarkers();

        if (!map) return;

        currentPins.forEach(pin => {
            const el = document.createElement('div');
            el.className = 'loop-marker ' + getPinClass(pin.type);
            el.id = 'marker-' + pin.id;
            el.innerHTML = getPinSvg(pin.type);

            if (pin.id === selectedPinId) {
                el.classList.add('active');
            }

            el.addEventListener('click', function(ev) {
                ev.stopPropagation();
                selectedPinId = pin.id;
                clearSelectedClass();
                el.classList.add('active');

                if (window.AndroidBridge && window.AndroidBridge.onPinClick) {
                    window.AndroidBridge.onPinClick(pin.id);
                }
            });

            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([pin.longitude, pin.latitude])
                .addTo(map);

            markers.push(marker);
        });
    }

    // Public JS API called from Android Jetpack Compose:
    window.setPinsJson = function(jsonString) {
        try {
            const parsed = JSON.parse(jsonString);
            renderMarkers(parsed);
        } catch (e) {
            console.error('Failed to parse pins JSON:', e);
        }
    };

    window.setUserLocation = function(lat, lng, autoCenter) {
        applyUserLocation(lat, lng, autoCenter);
    };

    window.selectPin = function(pinId) {
        selectedPinId = pinId;
        clearSelectedClass();
        const el = document.getElementById('marker-' + pinId);
        if (el) {
            el.classList.add('active');
        }
        const pin = currentPins.find(p => p.id === pinId);
        if (pin && map) {
            map.flyTo({
                center: [pin.longitude, pin.latitude],
                zoom: 15.6,
                essential: true,
                speed: 1.2
            });
        }
    };

    window.flyToCoords = function(lat, lng, zoom) {
        if (map) {
            map.flyTo({
                center: [lng, lat],
                zoom: zoom || 15.2,
                essential: true,
                speed: 1.4
            });
        }
    };

    let currentStyleKey = 'vector';

    window.setMapStyle = function(styleKey) {
        if (!map) return;
        const normalized = styleKey === 'osm' ? 'osm' : 'vector';
        if (normalized === currentStyleKey) return;
        currentStyleKey = normalized;
        try {
            if (normalized === 'osm') {
                map.setStyle(osmRasterStyle);
            } else {
                map.setStyle('https://tiles.openfreemap.org/styles/liberty');
            }
        } catch (e) {
            console.warn('Failed to switch style, keeping current style:', e);
        }
    };

    document.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
